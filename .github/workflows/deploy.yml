name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check manifest id
        # manifest id는 출처(jeiel85.github.io) 기준으로 풀린다. "./"이면 같은 출처의 다른 앱과 겹쳐 Chrome이 이미 설치된 앱으로 본다.
        # 명령에 '": "'가 들어가 YAML 한 줄 값으로 쓰면 매핑으로 읽히므로 블록으로 쓴다.
        run: |
          grep -q '"id": "/wayu-sansu/"' public/manifest.webmanifest || { echo '::error file=public/manifest.webmanifest::manifest id는 "/wayu-sansu/"여야 합니다(DECISIONS.md 참고).'; exit 1; }

      - name: Build with Vite
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
